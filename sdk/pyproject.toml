[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actshield"
version = "0.9.0"
description = "Security Control Plane SDK for Autonomous and Multi-Agent AI Systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ActShield Security Team" }
]
keywords = [
    "ai-security",
    "multi-agent",
    "provenance",
    "causal-tracing",
    "policy-enforcement",
    "llm-security",
    "taint-tracking",
    "threat-modeling",
    "sdk",
    "cli",
    "security-control-plane",
    "agent-security"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "typing-extensions>=4.8.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
dashboard = [
    "actshield[server]",
]
openai = [
    "openai>=1.30.0",
]
gemini = [
    "google-generativeai>=0.7.0",
]
anthropic = [
    "anthropic>=0.28.0",
]
ollama = [
    "httpx>=0.27.0",
]
all = [
    "actshield[server,openai,gemini,anthropic,ollama]",
]

[project.urls]
Homepage = "https://github.com/actshield/actshield"
Documentation = "https://actshield.dev/docs"
Repository = "https://github.com/actshield/actshield"
"Issue Tracker" = "https://github.com/actshield/actshield/issues"
Changelog = "https://github.com/actshield/actshield/blob/main/CHANGELOG.md"

[project.scripts]
actshield = "actshield.cli.main:main"
as-guard = "actshield.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["actshield*"]

[tool.setuptools.package-data]
actshield = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", ".."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ollama: marks tests requiring a live Ollama instance (deselect with '-m \"not ollama\"')",
    "integration: marks integration tests requiring external services",
    "slow: marks slow tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
