[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.9.0"
description = "Production-grade security control plane SDK for autonomous and multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "AgentGuard Security Team" }
]
keywords = [
    "ai-security",
    "multi-agent",
    "provenance",
    "causal-tracing",
    "policy-enforcement",
    "llm-security",
    "taint-tracking",
    "sdk",
    "cli",
    "security-control-plane"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "typing-extensions>=4.8.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
ai-openai = [
    "openai>=1.30.0",
]
ai-gemini = [
    "google-generativeai>=0.7.0",
]
ai-anthropic = [
    "anthropic>=0.28.0",
]
all = [
    "agentguard[server,ai-openai,ai-gemini,ai-anthropic]",
]

[project.scripts]
agentguard = "agentguard.__main__:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "ollama: marks tests requiring a live Ollama instance (deselect with '-m \"not ollama\"')",
]
